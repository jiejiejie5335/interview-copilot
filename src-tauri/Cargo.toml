[package]
name = "interview-copilot"
version = "0.1.0"
description = "A bilingual interview practice copilot"
authors = ["Interview Copilot contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "interview_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
futures-util = "0.3"
hound = "3.5"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tauri = { version = "2.8", features = ["macos-private-api"] }
tauri-plugin-ios-ambient-audio = { path = "../plugins" }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
libc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow"] }
sherpa-onnx = { version = "1.13.5", default-features = false, features = ["static"] }
