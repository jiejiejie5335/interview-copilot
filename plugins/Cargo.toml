[package]
name = "tauri-plugin-ios-ambient-audio"
version = "0.1.0"
authors = [ "Interview Copilot contributors" ]
description = "Native iOS ambient microphone capture for Interview Copilot"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-ios-ambient-audio"

[dependencies]
tauri = { version = "2.8" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
